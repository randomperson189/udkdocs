[Setup]
Product=YourProductNameCodeTODO
Language=int
Version=1
Exe=System\UE2Runtime.exe
CdAutoPlay=True
IsMasterProduct=True
Patch=False
Tree=True
SrcPath=..\%Product%-%Version%\
MasterPath=..
MasterPathContent=..
Visible=True
Group=SetupGroup
Group=ProjectGroup
Group=ContentGroup
;EditorGroup is optinal. Remove this line if you do not want your project to ship with the editing tools
Group=EditorGroup
License=License.int

[SetupGroup]
Copy=(Src=System\License.*)
Copy=(Src=System\Manifest.*,Flags=3)
Backup=System\Core.dll
Backup=System\VorbisFile.dll
Backup=System\IFC23.dll
Backup=System\Core.int
Backup=System\Core.%Language%
Backup=System\Engine.dll
Backup=System\Engine.int
Backup=System\Engine.%Language%
Backup=System\Window.dll
Backup=System\Window.int
Backup=System\Window.%Language%
Backup=System\Setup.exe
Backup=System\SetupStrings.int
Backup=System\Setup.%Language%
Backup=System\Manifest.ini
Backup=System\MSVCR71.dll
Backup=System\MSVCR70.dll
Backup=Help\InstallerLogo.bmp
Delete=System\Detected.log
Delete=System\Detected.ini
Delete=System\UE2Runtime.log
Delete=System\Editor.log
Backup=System\Ogg.dll
Backup=System\Vorbis.dll
WinRegistry=HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Uninstall\%Product%\DisplayName=%LocalProduct%
WinRegistry=HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Uninstall\%Product%\UninstallString=%DestPath%\System\Setup.exe uninstall "%Product%"

[HelpGroup]
File=(Src=Help\UE2Runtime.ico)
;File=(Src=Help\YourProductTODO.ico)
File=(Src=Help\UnrealEd.ico)
;File=(Src=Help\YourProductReadmeTODO.txt,Master=Help\YourProductReadmeTODO.txt)
;File=(Src=Help\YourProductLogoTODO.bmp,Master=Help\YourProductLogoTODO.bmp)
;File=(Src=Help\YourProductInstallerLogoTODO.bmp,Master=Help\YourProductInstallerLogoTODO.bmp)
;File=(Src=System\YourProductTODO.url)


